<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The site keeps its own colours when the phone is in dark mode. Some browsers (Samsung Internet, in-app browsers)
     recolour any page that does not say it handles dark mode itself, and ignore "light only". So the page says it
     supports both, and its dark styles are simply the same colours again (see type.css). -->
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>The desk · The Dinerworkshop</title>
<link rel="icon" href="assets/logo-ink.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Inter+Tight:wght@300;400&display=swap" rel="stylesheet">
<style>
/* The private bookings desk. Not linked from the site; sign-in is checked by the database, not by this page. */
:root {
  --cream: #f1eadf; --cream-2: #e9e2d5; --paper: #f7f2e8; --ink: #2a1d16; --brown-2: #19110b;
  --gold: #b5925c; --muted: #7a6c5f; --line: rgba(42, 29, 22, .14);
  --ok: #3f6b4f; --wait: #a0741f; --no: #8b5a4a;
  --sans: "Inter", "Helvetica Neue", Arial, sans-serif; --head: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
input, textarea, select, button, dialog { color-scheme: only light; }
@media (prefers-color-scheme: dark) { html, body { background-color: #f1eadf; color: #2a1d16; } }
body { margin: 0; background: var(--cream); color: var(--ink); font: 300 15px/1.55 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-family: var(--head); font-weight: 300; }
a { color: inherit; }
[hidden] { display: none !important; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--ink);
  background: var(--ink); color: var(--cream); font-size: 12px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: background .25s, color .25s, border-color .25s, opacity .25s; }
.btn:hover { background: var(--brown-2); border-color: var(--brown-2); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn--ghost:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.btn--wa { background: #1f7a4a; border-color: #1f7a4a; }
.btn--wa:hover { background: #17603a; border-color: #17603a; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .cal__day:focus-visible, .cal__item:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* sign in */
.gate { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
.gate__card { width: 100%; max-width: 400px; padding: 38px 32px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.gate__card img { height: 34px; display: block; margin-bottom: 26px; }
.gate__card h1 { font-size: 30px; text-transform: uppercase; letter-spacing: -.02em; line-height: 1; }
.gate__card p { margin: 10px 0 0; color: var(--muted); }
.field { display: block; margin-top: 16px; }
.field > span { display: block; margin-bottom: 6px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 10px 12px; background: #fffdf8; border: 1px solid var(--line); border-radius: 6px; }
.field textarea { min-height: 76px; resize: vertical; }
.gate__card .btn { width: 100%; margin-top: 22px; }
.err { margin-top: 12px; color: var(--no); font-size: 14px; }

/* the desk */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px clamp(16px, 4vw, 40px); background: rgba(241, 234, 223, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top img { height: 28px; }
.top__sp { flex: 1; }
.views { display: flex; gap: 6px; }
.note { margin-top: 16px; padding: 14px 16px; background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
.wrap { max-width: 1240px; margin: 0 auto; padding: clamp(22px, 3.4vw, 40px) clamp(16px, 4vw, 40px) 80px; }
.wrap > h1 { font-size: clamp(32px, 4vw, 52px); text-transform: uppercase; letter-spacing: -.025em; line-height: .95; }
.stats { margin-top: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { padding: 18px 20px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
.stat b { display: block; font: 300 34px/1 var(--head); letter-spacing: -.02em; }
.stat span { display: block; margin-top: 8px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat small { display: block; margin-top: 2px; font-size: 13.5px; color: var(--muted); }

.cols { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 26px; align-items: start; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--cream); }
.tab i { font-style: normal; opacity: .65; margin-left: 4px; }
.dayline { margin-top: 14px; display: flex; align-items: center; gap: 12px; font-size: 14px; }
.list { margin-top: 16px; display: grid; gap: 12px; }
.empty { padding: 42px 20px; text-align: center; color: var(--muted); background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; }

.card { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.card__date { padding: 18px 10px; text-align: center; background: var(--cream-2); border-right: 1px solid var(--line); }
.card__date b { display: block; font: 300 36px/1 var(--head); }
.card__date span { display: block; margin-top: 6px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
.card__date em { display: block; margin-top: 2px; font-style: normal; font-size: 12.5px; color: var(--muted); }
.card__date strong { display: block; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); font-weight: 400; font-size: 13.5px; }
.card__body { padding: 16px 18px 18px; min-width: 0; }
.card__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.card__head h3 { font-size: 22px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.chip { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.chip--pending { color: var(--wait); border-color: currentColor; }
.chip--accepted { color: var(--ok); border-color: currentColor; }
.chip--declined, .chip--cancelled { color: var(--no); border-color: currentColor; }
.card__meta { margin: 6px 0 0; }
.card__contact { margin: 4px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.card__contact a { text-decoration-color: var(--line); text-underline-offset: 3px; }
.card dl { margin: 12px 0 0; display: grid; gap: 8px; }
.card dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card dd { margin: 1px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.card__notes { margin-top: 12px; }
.card__notes textarea { min-height: 54px; }
.paid { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.paid label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.paid input { width: 17px; height: 17px; accent-color: var(--ink); }
.card__acts { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.card__when { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }

/* month */
.cal { position: sticky; top: 76px; padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
.cal__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal__head h2 { font-size: 19px; text-transform: uppercase; letter-spacing: -.01em; }
.cal__nav { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: transparent; cursor: pointer; }
.cal__grid { margin-top: 12px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal__dow { text-align: center; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; }
.cal__day { position: relative; aspect-ratio: 1; border: 1px solid transparent; border-radius: 6px; background: transparent; font-size: 13.5px; cursor: pointer; }
.cal__day:hover { border-color: var(--line); }
.cal__day.is-closed { color: rgba(42, 29, 22, .35); }
.cal__day.is-today { border-color: var(--gold); }
.cal__day.has-pending { box-shadow: inset 0 0 0 1.5px var(--wait); }
.cal__day.has-accepted { background: var(--ink); color: var(--cream); }
.cal__day.is-picked { outline: 2px solid var(--gold); outline-offset: 1px; }
.cal__key { margin-top: 14px; display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
.cal__key span { display: inline-flex; align-items: center; gap: 8px; }
.cal__key i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
/* the month as a list: every evening with its time */
.cal__list { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.cal__list h3 { margin-bottom: 4px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-family: var(--sans); font-weight: 400; }
.cal__list p { margin: 0; font-size: 13.5px; color: var(--muted); }
.cal__item { display: grid; grid-template-columns: 62px 70px minmax(0, 1fr); gap: 8px; align-items: baseline; width: 100%; padding: 8px 8px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
.cal__item:hover, .cal__item[aria-pressed="true"] { border-color: var(--line); background: #fffdf8; }
.cal__item b { font-weight: 400; }
.cal__item span { color: var(--muted); }
.cal__item.is-wait span { color: var(--wait); }
.cal__item em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* add / edit */
dialog { width: min(560px, calc(100vw - 28px)); max-height: calc(100vh - 28px); padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgba(25, 17, 11, .5); }
.form { padding: 26px 26px 22px; }
.form h2 { font-size: 26px; text-transform: uppercase; letter-spacing: -.02em; overflow-wrap: anywhere; }
.form > p { margin: 10px 0 0; color: var(--muted); }
.form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form__check { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.form__check label { display: inline-flex; align-items: center; gap: 8px; }
.form__check input { width: 17px; height: 17px; accent-color: var(--ink); }
.form__acts { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; }
.form__acts .sp { flex: 1; }

.toast { position: fixed; left: 50%; bottom: 22px; z-index: 30; transform: translateX(-50%); max-width: calc(100vw - 28px); display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--ink); color: var(--cream); border-radius: 8px; box-shadow: 0 14px 34px rgba(25, 17, 11, .3); }
.toast a { color: var(--cream); white-space: nowrap; }

@media (max-width: 900px) {
  .cols { grid-template-columns: 1fr; }
  .cal { position: static; order: -1; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:last-child { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .card { grid-template-columns: 1fr; }
  .card__date { display: flex; align-items: baseline; gap: 10px; padding: 12px 18px; text-align: left; border-right: 0; border-bottom: 1px solid var(--line); }
  .card__date b { font-size: 26px; } .card__date span, .card__date em { margin-top: 0; }
  .card__date strong { margin: 0 0 0 auto; padding: 0; border: 0; }
  .form__row { grid-template-columns: 1fr; }
  .top .btn span.long { display: none; }
  .top { flex-wrap: wrap; gap: 8px 10px; }
  .top img { display: none; }
}
/* more sections: overview, calendar, guests, accounts */
.views { flex-wrap: wrap; }
.tab { white-space: nowrap; }
.mnav { display: flex; align-items: center; gap: 10px; }
.mnav h2 { min-width: 176px; text-align: center; font-size: 19px; text-transform: uppercase; letter-spacing: -.01em; }
.wrap > .mnav { margin-top: 20px; }
.cal__head .mnav { width: 100%; justify-content: space-between; }
.cal__head .mnav h2 { min-width: 0; }
.stats--4 { grid-template-columns: repeat(4, 1fr); }
.stat--go { text-align: left; cursor: pointer; }
.stat--go:hover { border-color: var(--ink); }
.cols--even { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.panel { padding: 20px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
.panel h2 { font: 400 11.5px/1.4 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bars { margin-top: 16px; height: 230px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.bars__col { min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bars__col em { font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; min-height: 18px; }
.bars__stack { flex: 1; min-height: 0; width: 100%; max-width: 56px; display: flex; flex-direction: column; justify-content: flex-end; border-bottom: 1px solid var(--line); }
.bars__stack i { display: block; flex: none; width: 100%; }
.bars__dining { background: var(--ink); }
.bars__claypot { background: var(--gold); }
.bars__col span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bars__col.is-now span { color: var(--ink); font-weight: 500; }
.cal__key--row { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.rowlist { margin-top: 10px; display: grid; gap: 2px; }
.rowlist p { margin: 0; font-size: 13.5px; color: var(--muted); }
.rowlist__item { display: grid; grid-template-columns: 98px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; width: 100%; padding: 9px 8px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 6px; font-size: 14px; cursor: pointer; }
.rowlist__item:hover { border-color: var(--line); background: #fffdf8; }
.rowlist__item b { font-weight: 400; }
.rowlist__item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowlist__item em { font-style: normal; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.paid__sum { font-size: 13.5px; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field--grow { flex: 1; min-width: 220px; margin-top: 0; }
.rowlist__item:focus-visible, .guest:focus-visible, .ledger__row:focus-visible, .big__item:focus-visible, .big__num:focus-visible, .stat--go:focus-visible, .cal__nav:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.big { margin-top: 16px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.big__dow { padding: 0 4px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.big__day { min-width: 0; min-height: 116px; padding: 6px; display: flex; flex-direction: column; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.big__day.is-blank { background: transparent; border-color: transparent; }
.big__day.is-closed { background: rgba(247, 242, 232, .45); }
.big__day.is-today { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.big__day.is-over { background: #fffdf8; border-color: var(--ink); }
.big__num { align-self: flex-start; min-width: 26px; height: 24px; padding: 0 5px; border: 0; border-radius: 4px; background: transparent; font-size: 13px; color: var(--muted); text-align: left; cursor: pointer; }
.big__num:hover { background: var(--cream-2); color: var(--ink); }
.big__item { display: block; width: 100%; padding: 4px 6px; border: 0; border-radius: 4px; background: var(--cream-2); color: var(--ink); font-size: 12px; line-height: 1.3; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.big__item b { font-weight: 500; }
.big__item--accepted, .big__item--completed { background: var(--ink); color: var(--cream); }
.big__item--completed { opacity: .6; }
.big__item--pending { background: transparent; box-shadow: inset 0 0 0 1.5px var(--wait); color: var(--wait); }
.big__item--pot { background: var(--gold); color: var(--brown-2); }
.big__item--bday { background: #c9d8cd; }
.big__item[draggable="true"] { cursor: grab; }
.big__hint { flex-basis: 100%; }
.agenda { display: none; margin-top: 16px; gap: 12px; }
.agenda__day { padding: 14px; display: grid; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
.agenda__day h3 { font: 400 11.5px/1.4 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.agenda .big__item { padding: 9px 10px; font-size: 14px; white-space: normal; }

.guests { margin-top: 14px; display: grid; gap: 6px; }
.guest { display: grid; grid-template-columns: minmax(0, 2.2fr) 1fr .7fr .5fr .8fr 1.1fr; gap: 10px; align-items: center; width: 100%; padding: 12px 14px; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; cursor: pointer; }
.guest:hover { border-color: var(--ink); }
.guest--head { padding-top: 0; padding-bottom: 2px; background: transparent; border-color: transparent; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: default; }
.guest--head:hover { border-color: transparent; }
.guest__who b { display: block; font: 300 18px/1.2 var(--head); }
.guest__who small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.form .chip { margin-right: 6px; }
.pop__dl { margin: 12px 0 0; display: grid; gap: 8px; }
.pop__dl dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pop__dl dd { margin: 1px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.form .paid { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.form .paid label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.form .paid input { width: 17px; height: 17px; accent-color: var(--ink); }
.history { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.history h3 { margin-bottom: 6px; font: 400 11.5px/1.4 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.history p { margin: 4px 0 0; font-size: 14px; }
.history b { margin-right: 6px; font-weight: 400; color: var(--muted); }

.ledger { margin-top: 14px; display: grid; gap: 4px; }
.ledger__row { display: grid; grid-template-columns: 76px minmax(0, 1fr) minmax(0, 2fr) 120px 110px; gap: 10px; align-items: baseline; width: 100%; padding: 11px 14px; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; font-size: 14px; cursor: pointer; }
.ledger__row:hover { border-color: var(--ink); }
.ledger__row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ledger__row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.ledger__row--head, .ledger__row--foot, .ledger__row--head:hover, .ledger__row--foot:hover { background: transparent; border-color: transparent; cursor: default; }
.ledger__row--head { padding-bottom: 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ledger__row--foot { font-weight: 500; }
.ledger__row.is-refund span:last-child { color: var(--no); }

@media (max-width: 900px) {
  .top { flex-wrap: wrap; gap: 8px 10px; }
  .views { order: 5; flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .stats--4 { grid-template-columns: 1fr 1fr; }
  .stats--6 .stat:last-child, .stats--4 .stat:last-child { grid-column: auto; }
  .cols--even { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .big, .cal__key .big__hint { display: none; }
  .agenda { display: grid; }
  .guest--head, .ledger__row--head { display: none; }
  .guest { grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .guest__who { grid-column: 1 / -1; }
  .guest span[data-l]:empty { display: none; }
  .guest span[data-l]::before { content: attr(data-l) ": "; color: var(--muted); }
  .ledger__row { grid-template-columns: 62px minmax(0, 1fr) auto; }
  .ledger__row span:nth-child(3), .ledger__row span:nth-child(4) { display: none; }
  .rowlist__item { grid-template-columns: 84px minmax(0, 1fr) auto; }
}
/* ── the look: a calm, Apple-like desk. Sections down the side, content in soft rounded cards, plain sentence-case type ── */
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --head: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --card: #fbf7ef; --hair: rgba(42, 29, 22, .09); --r: 12px; --side: 244px;
}
body { font: 400 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; height: 100svh; display: flex; flex-direction: column; padding: 22px 12px 14px; background: rgba(233, 226, 213, .6); border-right: 1px solid var(--hair); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.side__logo { align-self: flex-start; height: 30px; margin: 4px 10px 24px; }
.side__nav, .side__foot { display: grid; gap: 2px; }
.side__foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--hair); }
.side__item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer; transition: background .15s; }
.side__item svg, .btn svg { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.side__item:hover { background: rgba(42, 29, 22, .06); }
.side__item[aria-current="page"] { background: var(--ink); color: var(--cream); }

.side__item[aria-current="page"] i { background: rgba(241, 234, 223, .22); }
.side__foot .side__item { font-weight: 400; color: var(--muted); }
.side__item:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.main { min-width: 0; }
.head { display: flex; align-items: center; gap: 12px; max-width: 1240px; margin: 0 auto; padding: 30px clamp(18px, 3.4vw, 44px) 0; }
.head h1 { font: 700 32px/1.1 var(--head); letter-spacing: -.022em; }
.head__acts { margin-left: auto; display: flex; gap: 8px; }
.head__acts .btn { white-space: nowrap; }
.head__acts .only-small { display: none; padding: 7px 9px; }
.wrap { padding: 4px clamp(18px, 3.4vw, 44px) 80px; }

.btn { gap: 6px; min-height: 36px; padding: 7px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.btn svg { width: 16px; height: 16px; stroke-width: 1.9; }
.btn--ghost { background: var(--card); border-color: var(--hair); }
.tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: rgba(42, 29, 22, .07); border-radius: 10px; }
.tab { padding: 6px 13px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.tab[aria-selected="true"] { background: #fffdf8; color: var(--ink); box-shadow: 0 1px 3px rgba(42, 29, 22, .16); }
.chip { padding: 2px 9px; font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.stat, .card, .panel, .cal, .guest, .agenda__day, .ledger__row, .big__day { background: var(--card); border-color: var(--hair); }
.stat, .card, .panel, .cal, .guest, .agenda__day, .empty, .note { border-radius: var(--r); }
.stat, .card, .panel, .cal { box-shadow: 0 1px 2px rgba(42, 29, 22, .04); }
.ledger__row, .big__day { border-radius: 10px; }
.ledger__row--head, .ledger__row--foot, .guest--head, .big__day.is-blank { background: transparent; border-color: transparent; box-shadow: none; }
.stat b { font: 600 30px/1 var(--head); letter-spacing: -.02em; }
.stat span, .field > span, .card dt, .pop__dl dt, .cal__dow, .cal__list h3, .panel h2, .bars__col span, .big__dow, .agenda__day h3, .guest--head, .history h3, .ledger__row--head, .card__date span {
  font-family: var(--sans); font-size: 12.5px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.panel h2 { font-size: 14px; font-weight: 600; color: var(--ink); }
.cal__head h2, .mnav h2 { font: 600 16px/1.2 var(--head); letter-spacing: -.01em; text-transform: none; }
.cal__nav { border-color: var(--hair); border-radius: 8px; background: var(--card); }
.card__date { background: rgba(42, 29, 22, .04); border-right-color: var(--hair); }
.card__date b { font: 600 32px/1 var(--head); letter-spacing: -.02em; }
.card__head h3 { font: 600 18px/1.25 var(--head); letter-spacing: -.01em; }
.guest__who b { font: 600 15.5px/1.25 var(--head); }
.field input, .field select, .field textarea { border-color: var(--hair); border-radius: 8px; }
.cal { top: 24px; }
dialog { border-color: var(--hair); border-radius: 16px; box-shadow: 0 24px 60px rgba(25, 17, 11, .28); }
.form h2 { font: 700 22px/1.2 var(--head); letter-spacing: -.015em; text-transform: none; }
.gate__card { border-color: var(--hair); border-radius: 16px; box-shadow: 0 12px 40px rgba(42, 29, 22, .08); }
.gate__card h1 { font: 700 26px/1.1 var(--head); letter-spacing: -.02em; text-transform: none; }
.toast { border-radius: 12px; }

@media (max-width: 900px) {
  /* on a phone the sections become a tab bar along the bottom */
  .shell { display: block; }
  .side { position: fixed; inset: auto 0 0 0; z-index: 20; height: auto; flex-direction: row; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--hair); background: rgba(241, 234, 223, .9); }
  .side__logo, .side__foot { display: none; }
  .side__nav { flex: 1; display: flex; gap: 0; }
  .side__item { position: relative; flex: 1; min-width: 0; flex-direction: column; gap: 3px; padding: 5px 2px; font-size: 10.5px; color: var(--muted); }
  .side__item svg { width: 22px; height: 22px; }
  .side__item:hover { background: transparent; }
  .side__item[aria-current="page"] { background: transparent; color: var(--ink); }
  .side__item i, .side__item[aria-current="page"] i { position: absolute; top: 1px; left: calc(50% + 5px); margin: 0; min-width: 16px; padding: 0 4px; background: var(--no); color: #fff; font-size: 10px; line-height: 16px; }
  .head { padding-top: 18px; }
  .head h1 { font-size: 28px; }
  .head__acts .only-small { display: inline-flex; }
  .wrap { padding-bottom: 110px; }
  .toast { bottom: 84px; }
  .cal { top: auto; }
}
/* boards, and the delete button at the end of a row */
.toolbar--split { justify-content: space-between; }
.toolbar--end { margin-top: 22px; justify-content: flex-end; }
.kan { margin-top: 12px; padding-bottom: 8px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(214px, 1fr); gap: 12px; align-items: start; overflow-x: auto; }
.kan__col { min-height: 240px; padding: 10px; display: grid; gap: 8px; align-content: start; background: rgba(42, 29, 22, .05); border-radius: 14px; transition: background .15s; }
.kan__col.is-over { background: rgba(42, 29, 22, .1); outline: 2px solid var(--ink); outline-offset: -2px; }
.kan__col h2 { display: flex; justify-content: space-between; padding: 4px 6px 2px; font: 600 13.5px/1.4 var(--sans); }
.kan__col h2 i { font-style: normal; font-weight: 500; color: var(--muted); }
.kan__card { display: block; width: 100%; padding: 11px 12px; text-align: left; background: var(--card); border: 1px solid var(--hair); border-radius: 10px; box-shadow: 0 1px 2px rgba(42, 29, 22, .06); font-size: 13.5px; cursor: grab; }
.kan__card:hover { border-color: rgba(42, 29, 22, .3); }
.kan__card:focus-visible, .rowdel:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.kan__card b { display: block; font: 600 14.5px/1.3 var(--head); overflow-wrap: anywhere; }
.kan__card span { display: block; margin-top: 2px; color: var(--muted); }
.kan__card em { display: inline-block; margin-top: 8px; padding: 1px 8px; border: 1px solid var(--hair); border-radius: 999px; font-style: normal; font-size: 12px; font-weight: 500; color: var(--muted); }
.kan__card em.is-ok { color: var(--ok); border-color: currentColor; }
.kan__card em.is-wait { color: var(--wait); border-color: currentColor; }
.kan__empty { margin: 0; padding: 14px 8px; text-align: center; font-size: 13px; color: var(--muted); }
.rowwrap { display: grid; grid-template-columns: minmax(0, 1fr) 38px; gap: 6px; align-items: stretch; }
.rowdel { display: grid; place-items: center; padding: 0; background: var(--card); border: 1px solid var(--hair); border-radius: 10px; color: var(--muted); cursor: pointer; }
.rowdel:hover { color: var(--no); border-color: var(--no); }
.rowdel svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.rowdel--blank { visibility: hidden; }
@media (max-width: 760px) { .rowwrap:has(.guest--head), .rowwrap:has(.ledger__row--head) { display: none; } }
/* dragging, and red for anything cancelled */
:root { --no: #b3261e; }
.kan__card, .big__item.is-movable { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: grab; }
.is-dragging { opacity: .3; }
.drag-ghost { position: fixed; z-index: 100; margin: 0; pointer-events: none; opacity: .97; box-shadow: 0 18px 40px rgba(25, 17, 11, .3); cursor: grabbing; }
body.is-dragging-any, body.is-dragging-any * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
.big__day.is-over { background: #fffdf8; border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.kan__col--red h2 { color: var(--no); }
.kan__col--red.is-over { outline-color: var(--no); background: rgba(179, 38, 30, .08); }
.kan__card.is-cancelled, .card.is-cancelled { border-color: var(--no); box-shadow: inset 0 0 0 1px var(--no); }
.kan__card.is-cancelled em { color: var(--no); border-color: currentColor; }
.card.is-cancelled .card__date { border-right-color: var(--no); }
</style>
